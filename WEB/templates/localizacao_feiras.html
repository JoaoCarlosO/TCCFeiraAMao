<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localização das Feiras - Feira na Mão</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/localizacao_feiras.css') }}">
</head>

<body>
    <div class="localizacao-container">
        <!-- Sidebar -->
        <div class="sidebar-localizacao">
            <!-- Cabeçalho -->
            <div class="header-localizacao">
                <h1 class="titulo-localizacao">FEIRA</h1>
                <h2 class="subtitulo-localizacao">à mão</h2>
                <p class="descricao-localizacao">Localização das Feiras Cadastradas</p>
            </div>

            <!-- Filtros -->
            <div class="filtros-localizacao">
                <div class="grupo-filtro">
                    <label class="label-filtro">Status da Feira:</label>
                    <select class="select-filtro" id="filtroStatus">
                        <option value="todas">Todas as Feiras</option>
                        <option value="aberta">Abertas Agora</option>
                        <option value="fechada">Fechadas</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label class="label-filtro">Ordenar por:</label>
                    <select class="select-filtro" id="filtroOrdenacao">
                        <option value="nome">Nome A-Z</option>
                        <option value="status">Status</option>
                        <option value="proximidade">Proximidade</option>
                    </select>
                </div>
            </div>

            <!-- Lista de Feiras -->
            <div class="lista-feiras" id="listaFeiras">
                <div id="loadingFeiras" class="carregando">🔄 Carregando feiras cadastradas...</div>
            </div>
        </div>

        <!-- Mapa -->
        <div class="mapa-container">
            <!-- Botão Voltar -->
            <a href="{{ url_for('homeVend') }}" class="btn-voltar">
                ← Voltar para Home
            </a>

            <!-- Mapa -->
            <div id="mapa-feiras"></div>

            <!-- Legenda -->
            <div class="legenda-mapa">
                <div class="titulo-legenda">Legenda</div>
                <div class="item-legenda">
                    <div class="cor-legenda cor-aberta"></div>
                    <span>Feira Aberta</span>
                </div>
                <div class="item-legenda">
                    <div class="cor-legenda cor-fechada"></div>
                    <span>Feira Fechada</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let markers = [];
        let feirasData = [];

        // Inicializar mapa
        function inicializarMapa() {
            console.log('🗺️ Inicializando mapa...');
            
            // Verifica se o elemento existe
            const mapaElement = document.getElementById('mapa-feiras');
            if (!mapaElement) {
                console.error('❌ Elemento mapa-feiras não encontrado!');
                return;
            }
            
            map = L.map('mapa-feiras').setView([-23.5505, -46.6333], 12);
            
            // Mapa gratuito do OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            console.log('✅ Mapa inicializado, carregando feiras...');
            // Carregar feiras
            carregarFeiras();
        }

        // Função segura para mostrar/ocultar loading
        function setLoading(show, message = '🔄 Carregando feiras...') {
            const loadingElement = document.getElementById('loadingFeiras');
            const listaElement = document.getElementById('listaFeiras');
            
            if (loadingElement) {
                if (show) {
                    loadingElement.style.display = 'block';
                    loadingElement.textContent = message;
                    listaElement.innerHTML = '';
                    listaElement.appendChild(loadingElement);
                } else {
                    loadingElement.style.display = 'none';
                }
            }
        }

        // Carregar feiras do backend
        async function carregarFeiras() {
            try {
                setLoading(true, '🔄 Carregando feiras...');
                
                console.log('📡 Fazendo requisição para /api/feiras-mapa...');
                const response = await fetch('/api/feiras-mapa');
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const feiras = await response.json();
                console.log('✅ Feiras carregadas:', feiras);
                
                feirasData = feiras;
                
                // Atualizar lista lateral
                atualizarListaFeiras(feiras);
                
                // Limpar marcadores antigos
                markers.forEach(marker => {
                    if (map && marker) {
                        map.removeLayer(marker);
                    }
                });
                markers = [];
                
                // Adicionar novos marcadores se houver feiras
                if (feiras.length > 0) {
                    console.log(`📍 Adicionando ${feiras.length} marcadores...`);
                    
                    feiras.forEach((feira, index) => {
                        console.log(`  ${index + 1}. ${feira.nome} - ${feira.lat}, ${feira.lng}`);
                        
                        const estaAberta = verificarFeiraAberta(feira.horario);
                        const iconColor = estaAberta ? '#28a745' : '#dc3545';
                        
                        const customIcon = L.divIcon({
                            className: 'custom-marker',
                            html: `<div style="background-color: ${iconColor}; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`,
                            iconSize: [26, 26],
                            iconAnchor: [13, 13]
                        });
                        
                        // Verifica se as coordenadas são válidas
                        if (feira.lat && feira.lng && !isNaN(parseFloat(feira.lat)) && !isNaN(parseFloat(feira.lng))) {
                            const marker = L.marker([parseFloat(feira.lat), parseFloat(feira.lng)], { 
                                icon: customIcon 
                            }).addTo(map);
                            
                            marker.bindPopup(`
                                <div class="feira-info">
                                    <h4>${feira.nome}</h4>
                                    <p><strong>Local:</strong> ${feira.localizacao}</p>
                                    <p><strong>Dias:</strong> ${feira.dias}</p>
                                    <p><strong>Horário:</strong> ${feira.horario}</p>
                                    <p><strong>Status:</strong> <span style="color: ${iconColor}">${estaAberta ? '🟢 ABERTA' : '🔴 FECHADA'}</span></p>
                                </div>
                            `);
                            
                            markers.push(marker);
                        } else {
                            console.warn(`⚠️ Coordenadas inválidas para "${feira.nome}": ${feira.lat}, ${feira.lng}`);
                        }
                    });
                    
                    // Ajustar zoom para mostrar todas as feiras
                    if (markers.length > 0) {
                        const group = new L.featureGroup(markers);
                        map.fitBounds(group.getBounds().pad(0.1));
                        console.log('✅ Map ajustado para mostrar todas as feiras');
                    } else {
                        console.warn('⚠️ Nenhum marcador com coordenadas válidas foi adicionado');
                    }
                } else {
                    console.log('ℹ️ Nenhuma feira cadastrada');
                }
                
            } catch (error) {
                console.error('❌ Erro ao carregar feiras:', error);
                
                const listaElement = document.getElementById('listaFeiras');
                if (listaElement) {
                    listaElement.innerHTML = `
                        <div class="erro-carregamento">
                            ❌ Erro ao carregar feiras<br>
                            <small>${error.message}</small>
                        </div>
                    `;
                }
            } finally {
                setLoading(false);
            }
        }

        // Verificar se a feira está aberta baseado no horário
        function verificarFeiraAberta(horario) {
            if (!horario || horario === 'Não informado') return false;
            
            try {
                const agora = new Date();
                const horaAtual = agora.getHours();
                const minutoAtual = agora.getMinutes();
                const tempoAtual = horaAtual * 60 + minutoAtual;
                
                // Tenta extrair horários (formato: HH:MM - HH:MM)
                const horarios = horario.match(/(\d{1,2}):(\d{2})/g);
                if (horarios && horarios.length >= 2) {
                    const [horaAbertura, minutoAbertura] = horarios[0].split(':').map(Number);
                    const [horaFechamento, minutoFechamento] = horarios[1].split(':').map(Number);
                    
                    const tempoAbertura = horaAbertura * 60 + minutoAbertura;
                    const tempoFechamento = horaFechamento * 60 + minutoFechamento;
                    
                    return tempoAtual >= tempoAbertura && tempoAtual < tempoFechamento;
                }
            } catch (e) {
                console.warn('Erro ao verificar horário:', e);
            }
            
            return false;
        }

        // Atualizar lista lateral de feiras
        function atualizarListaFeiras(feiras) {
            const listaContainer = document.getElementById('listaFeiras');
            if (!listaContainer) return;
            
            if (feiras.length === 0) {
                listaContainer.innerHTML = '<div class="nenhuma-feira">Nenhuma feira cadastrada</div>';
                return;
            }
            
            const listaHTML = feiras.map(feira => {
                const estaAberta = verificarFeiraAberta(feira.horario);
                const statusClass = estaAberta ? 'status-aberta' : 'status-fechada';
                const statusText = estaAberta ? '🟢 ABERTA' : '🔴 FECHADA';
                
                return `
                    <div class="item-feira" onclick="focusOnFeira(${feira.lat}, ${feira.lng})">
                        <div class="info-feira">
                            <h4 class="nome-feira">${feira.nome}</h4>
                            <p class="local-feira"><strong>Local:</strong> ${feira.localizacao}</p>
                            <p class="horario-feira"><strong>Horário:</strong> ${feira.horario}</p>
                        </div>
                        <div class="${statusClass}">${statusText}</div>
                    </div>
                `;
            }).join('');
            
            listaContainer.innerHTML = listaHTML;
        }

        // Focar no mapa quando clicar em uma feira na lista
        function focusOnFeira(lat, lng) {
            if (!map) return;
            
            map.setView([lat, lng], 15);
            
            // Abrir popup do marcador correspondente
            markers.forEach(marker => {
                const markerLatLng = marker.getLatLng();
                if (markerLatLng.lat === lat && markerLatLng.lng === lng) {
                    marker.openPopup();
                }
            });
        }

        // Iniciar quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Página carregada, inicializando...');
            inicializarMapa();
            
            // Atualizar a cada 30 segundos
            setInterval(carregarFeiras, 30000);
        });
    </script>
</body>
</html>
