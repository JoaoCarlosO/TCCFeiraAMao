<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Feira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('homeVend') }}">Feira na Mão</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Olá, {{ session.user_name }}</span>
                <a class="nav-link" href="{{ url_for('homeVend') }}">Voltar</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Cadastrar Nova Feira</h4>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label for="nome_feira" class="form-label">Nome da Feira *</label>
                                <input type="text" class="form-control" id="nome_feira" name="nome_feira" required>
                            </div>

                            <div class="mb-3">
                                <label for="localizacao" class="form-label">Localização *</label>
                                <textarea class="form-control" id="localizacao" name="localizacao" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="dias_funcionamento" class="form-label">Dias de Funcionamento</label>
                                <input type="text" class="form-control" id="dias_funcionamento" name="dias_funcionamento" placeholder="Ex: Segunda a Sábado">
                            </div>

                            <div class="mb-3">
                                <label for="horario_funcionamento" class="form-label">Horário de Funcionamento</label>
                                <input type="text" class="form-control" id="horario_funcionamento" name="horario_funcionamento" placeholder="Ex: 06:00 - 14:00">
                            </div>

                            <button type="submit" class="btn btn-success w-100">Cadastrar Feira</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
