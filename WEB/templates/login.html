<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" type="image/png" href="static/imgs/logo.png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <!-- Adicione o CSS das mensagens flash -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/flash-messages.css') }}">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap');
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <!-- Container para mensagens flash -->
  <div class="flash-messages">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">
            <div class="flash-content">
              <span>{{ message }}</span>
              <button class="flash-close-btn" onclick="this.closest('.flash-message').remove()">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <div class="container">
    <!-- Lado esquerdo -->
    <div class="image-side">
      <a href="{{ url_for('home') }}" class="btn_voltar">
        <img src="{{url_for('static', filename='imgs/botaoVoltar.png')}}" alt="botão voltar">
      </a>

      <img src="{{ url_for('static', filename='imgs/ImgLoginFundo.png') }}" alt="Imagem de frutas"
        class="background-img">
      <div class="curve-shape">
        <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
      </div>
      <div class="curve-shape2">
        <a href="{{ url_for('login') }}">Login</a>
      </div>
    </div>

    <!-- Lado direito -->
    <div class="login-box">
      <div class="right-content">
        <img src="{{ url_for('static', filename='imgs/logo.png') }}" alt="Logo da Feira à Mão" class="imgLogo" />
        <form class="login-form" method="POST" action="/login">
          <h2>Bem-Vindo de volta!</h2>
          <p>Faça seu Login</p>
          <input type="text" name="username" placeholder="Email" required>
          <input type="password" name="password" placeholder="Senha" required>
          <button type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
