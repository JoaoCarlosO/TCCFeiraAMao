<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bacasime+Antique&family=Cairo+Play:wght@200..1000&family=Hurricane&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap");
  </style>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("{{ url_for('static', filename='imgs/fundoBg.png') }}");
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      z-index: -1;
    }
  </style>
</head>

<body>
  <!-- NAVBAR adicionada -->
  <div class="navbar-container">
    <!-- Logo -->
    <img src="{{ url_for('static', filename='imgs/logo.png') }}" alt="Logo da Feira à Mão" id="imgLogo" />

    <!-- Links do menu -->
    <nav class="d-flex gap-4 align-items-center">
      <a href="{{ url_for('sobre')}}" class="text-decoration-none">Sobre</a>
      <a href="#containerFooter" class="text-decoration-none">Ajuda</a>
      <a href="{{ url_for('perfil') }}" class="text-decoration-none">Perfil</a>
      <a href="{{ url_for('login') }}" class="text-decoration-none">Login</a>
      <a href="{{ url_for('cadastro') }}" class="text-decoration-none">Cadastro</a>
    </nav>

    <a href="{{ url_for('home') }}" class="btn_voltar-navbar">
      <img src="{{ url_for('static', filename='imgs/botaoVoltar.png') }}" alt="botão voltar" />
    </a>
  </div>

  <!-- Conteúdo da página perfil -->
  <div class="container">
    <div class="profile-pic">
      <img src="{{ url_for('static', filename='imgs/fotoPerfil.png') }}" alt="Foto de Perfil" />
      <label class="camera-icon">📷</label>
    </div>

    {% if success %}
    <p class="success">{{ success }}</p>
    {% elif error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/perfil">
      <div class="input-group">
        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Manoel Silva" required />
      </div>
      <div class="input-group">
        <label>CPF:</label>
        <input type="text" name="cpf" placeholder="123.456.789-00" required />
      </div>
      <div class="input-group">
        <label>Endereço:</label>
        <input type="text" name="endereco" placeholder="Rua São Paulo" required />
      </div>
      <div class="input-group">
        <label>Email:</label>
        <input type="email" name="email" placeholder="manoelsilva239@email.com" required />
      </div>
      <div class="input-group">
        <label>Telefone:</label>
        <input type="tel" name="telefone" placeholder="13 989765423" required />
      </div>
      <div class="input-group">
        <label>Senha:</label>
        <input type="password" name="senha" placeholder="*********" required />
      </div>
      <button type="submit">Alterar</button>
    </form>

    <a href="/login" class="sair">Sair</a>
  </div>
  <footer class="text-center py-4" id="containerFooter">
  <p>&copy; 2023 Feira à Mão. Todos os direitos reservados.</p>
  <p>Desenvolvido por João Carlos, Ana Luiza e Fantinny.</p>
</footer>
</body>
</html>
