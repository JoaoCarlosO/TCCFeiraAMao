<!-- vendedor.html -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Vendedor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendedor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/homeCli.css') }}" />
    
</head>
<body>
    <section class="perfil-vendedor d-flex align-items-center mb-3">
        <img src="{{ url_for('static', filename=vendedor.foto) }}" class="foto-vendedor" alt="Foto do vendedor">
        <span class="nome-vendedor ms-2">{{ vendedor.nome }}</span>
    </section>

    <!-- Produtos do Vendedor -->
    <div class="produtos-vendedor">
        {% for produto in vendedor.produtos %}
        <div class="produto-item">
            <img src="{{ url_for('static', filename=produto.img) }}" class="produto-img" alt="{{ produto.nome }}">
            <div class="produto-info">
                <p class="produto-nome">{{ produto.nome }}</p>
                <p class="produto-preco">R${{ produto.preco }}</p>
                <div class="produto-acoes">
                    <span class="btn-add">＋</span>
                    <span class="btn-like">❤</span>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
